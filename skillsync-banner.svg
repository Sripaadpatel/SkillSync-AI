<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e1a"/>
      <stop offset="50%" style="stop-color:#0d1525"/>
      <stop offset="100%" style="stop-color:#080c18"/>
    </linearGradient>

    <!-- Accent glow for nodes -->
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0.35"/>
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:0"/>
    </radialGradient>

    <!-- Green glow -->
    <radialGradient id="nodeGlowGreen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00ff88;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#00ff88;stop-opacity:0"/>
    </radialGradient>

    <!-- Amber glow -->
    <radialGradient id="nodeGlowAmber" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffaa00;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#ffaa00;stop-opacity:0"/>
    </radialGradient>

    <!-- Center glow behind title -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0.08"/>
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:0"/>
    </radialGradient>

    <!-- Grid fade mask -->
    <linearGradient id="gridFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:white;stop-opacity:0"/>
      <stop offset="20%" style="stop-color:white;stop-opacity:1"/>
      <stop offset="80%" style="stop-color:white;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:white;stop-opacity:0"/>
    </linearGradient>
    <mask id="gridMask">
      <rect width="1200" height="340" fill="url(#gridFade)"/>
    </mask>

    <!-- Shimmer animation filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&amp;family=Syne:wght@700;800&amp;display=swap');

      .pulse-blue {
        animation: pulseBlue 3s ease-in-out infinite;
      }
      .pulse-green {
        animation: pulseGreen 3.5s ease-in-out infinite;
      }
      .pulse-amber {
        animation: pulseAmber 4s ease-in-out infinite;
      }
      .flow-line {
        stroke-dasharray: 6 4;
        animation: flowDash 1.8s linear infinite;
      }
      .flow-line-slow {
        stroke-dasharray: 6 4;
        animation: flowDash 2.8s linear infinite;
      }
      .fade-in-1 { animation: fadeIn 1s ease-out 0.2s both; }
      .fade-in-2 { animation: fadeIn 1s ease-out 0.5s both; }
      .fade-in-3 { animation: fadeIn 1s ease-out 0.8s both; }
      .fade-in-4 { animation: fadeIn 1s ease-out 1.1s both; }

      @keyframes pulseBlue {
        0%, 100% { opacity: 0.7; r: 5; }
        50% { opacity: 1; r: 7; }
      }
      @keyframes pulseGreen {
        0%, 100% { opacity: 0.6; r: 4; }
        50% { opacity: 1; r: 6; }
      }
      @keyframes pulseAmber {
        0%, 100% { opacity: 0.5; r: 3; }
        50% { opacity: 0.9; r: 5; }
      }
      @keyframes flowDash {
        to { stroke-dashoffset: -20; }
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="340" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g mask="url(#gridMask)" opacity="0.06">
    <!-- Vertical lines -->
    <line x1="80" y1="0" x2="80" y2="340" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="160" y1="0" x2="160" y2="340" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="240" y1="0" x2="240" y2="340" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="320" y1="0" x2="320" y2="340" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="400" y1="0" x2="400" y2="340" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="480" y1="0" x2="480" y2="340" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="560" y1="0" x2="560" y2="340" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="640" y1="0" x2="640" y2="340" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="720" y1="0" x2="720" y2="340" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="800" y1="0" x2="800" y2="340" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="880" y1="0" x2="880" y2="340" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="960" y1="0" x2="960" y2="340" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="1040" y1="0" x2="1040" y2="340" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="1120" y1="0" x2="1120" y2="340" stroke="#00d4ff" stroke-width="0.5"/>
    <!-- Horizontal lines -->
    <line x1="0" y1="60" x2="1200" y2="60" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="0" y1="120" x2="1200" y2="120" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="0" y1="180" x2="1200" y2="180" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="0" y1="240" x2="1200" y2="240" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#00d4ff" stroke-width="0.5"/>
  </g>

  <!-- Center glow -->
  <ellipse cx="600" cy="170" rx="320" ry="160" fill="url(#centerGlow)"/>

  <!-- ═══════════════════════════════════════ -->
  <!-- LEFT SIDE: Network graph (PDF → Vector) -->
  <!-- ═══════════════════════════════════════ -->

  <!-- Flow lines from left nodes to center -->
  <!-- PDF node → ETL -->
  <line x1="115" y1="100" x2="280" y2="155" stroke="#00d4ff" stroke-width="1" stroke-opacity="0.25" class="flow-line"/>
  <!-- Resume node → ETL -->
  <line x1="115" y1="170" x2="280" y2="165" stroke="#00d4ff" stroke-width="1" stroke-opacity="0.2" class="flow-line-slow"/>
  <!-- Skills node → ETL -->
  <line x1="115" y1="240" x2="280" y2="175" stroke="#00ff88" stroke-width="1" stroke-opacity="0.2" class="flow-line"/>
  <!-- ETL → Center engine -->
  <line x1="310" y1="165" x2="440" y2="170" stroke="#00d4ff" stroke-width="1.5" stroke-opacity="0.4" class="flow-line"/>

  <!-- Left input nodes -->
  <!-- PDF node -->
  <ellipse cx="90" cy="100" rx="32" ry="16" fill="#0d1a2e" stroke="#00d4ff" stroke-width="0.8" stroke-opacity="0.6"/>
  <text x="90" y="105" text-anchor="middle" font-family="'Space Mono', monospace" font-size="8" fill="#00d4ff" fill-opacity="0.9">PDF</text>
  <circle cx="90" cy="100" r="22" fill="url(#nodeGlow)"/>

  <!-- Resume node -->
  <ellipse cx="90" cy="170" rx="36" ry="16" fill="#0d1a2e" stroke="#00d4ff" stroke-width="0.8" stroke-opacity="0.5"/>
  <text x="90" y="175" text-anchor="middle" font-family="'Space Mono', monospace" font-size="8" fill="#00d4ff" fill-opacity="0.8">Resume</text>

  <!-- Skills node -->
  <ellipse cx="90" cy="240" rx="34" ry="16" fill="#0d1a2e" stroke="#00ff88" stroke-width="0.8" stroke-opacity="0.5"/>
  <text x="90" y="245" text-anchor="middle" font-family="'Space Mono', monospace" font-size="8" fill="#00ff88" fill-opacity="0.8">Skills</text>
  <circle cx="90" cy="240" r="22" fill="url(#nodeGlowGreen)"/>

  <!-- ETL processing box -->
  <rect x="266" y="148" width="60" height="32" rx="4" fill="#0a1628" stroke="#00d4ff" stroke-width="0.8" stroke-opacity="0.7"/>
  <text x="296" y="162" text-anchor="middle" font-family="'Space Mono', monospace" font-size="7" fill="#00d4ff">LLM</text>
  <text x="296" y="173" text-anchor="middle" font-family="'Space Mono', monospace" font-size="7" fill="#00d4ff">ETL</text>

  <!-- Pulse dots on left nodes -->
  <circle cx="90" cy="100" r="5" fill="#00d4ff" class="pulse-blue"/>
  <circle cx="90" cy="240" r="4" fill="#00ff88" class="pulse-green"/>

  <!-- ════════════════════════════════════════ -->
  <!-- RIGHT SIDE: Vector DB + output          -->
  <!-- ════════════════════════════════════════ -->

  <!-- Center engine → Vector DB -->
  <line x1="760" y1="170" x2="880" y2="120" stroke="#00d4ff" stroke-width="1.5" stroke-opacity="0.35" class="flow-line"/>
  <!-- Center engine → Gap Analysis -->
  <line x1="760" y1="170" x2="880" y2="220" stroke="#00ff88" stroke-width="1" stroke-opacity="0.3" class="flow-line-slow"/>
  <!-- Vector DB → Output -->
  <line x1="930" y1="120" x2="1060" y2="140" stroke="#00d4ff" stroke-width="1" stroke-opacity="0.25" class="flow-line"/>
  <!-- Gap → Output -->
  <line x1="930" y1="220" x2="1060" y2="200" stroke="#00ff88" stroke-width="1" stroke-opacity="0.25" class="flow-line-slow"/>

  <!-- ChromaDB node -->
  <rect x="872" y="100" width="72" height="36" rx="6" fill="#0a1628" stroke="#00d4ff" stroke-width="0.8" stroke-opacity="0.7"/>
  <text x="908" y="116" text-anchor="middle" font-family="'Space Mono', monospace" font-size="7" fill="#00d4ff">ChromaDB</text>
  <text x="908" y="128" text-anchor="middle" font-family="'Space Mono', monospace" font-size="7" fill="#00d4ff" fill-opacity="0.6">100K jobs</text>
  <circle cx="908" cy="118" r="28" fill="url(#nodeGlow)" opacity="0.6"/>

  <!-- Gap Analysis node -->
  <rect x="872" y="200" width="72" height="36" rx="6" fill="#0a1628" stroke="#00ff88" stroke-width="0.8" stroke-opacity="0.6"/>
  <text x="908" y="216" text-anchor="middle" font-family="'Space Mono', monospace" font-size="7" fill="#00ff88">Gap</text>
  <text x="908" y="228" text-anchor="middle" font-family="'Space Mono', monospace" font-size="7" fill="#00ff88" fill-opacity="0.7">Analysis</text>
  <circle cx="908" cy="218" r="28" fill="url(#nodeGlowGreen)" opacity="0.5"/>

  <!-- Output node -->
  <rect x="1054" y="150" width="78" height="40" rx="6" fill="#0a1628" stroke="#ffaa00" stroke-width="0.8" stroke-opacity="0.7"/>
  <text x="1093" y="167" text-anchor="middle" font-family="'Space Mono', monospace" font-size="7" fill="#ffaa00">Match</text>
  <text x="1093" y="179" text-anchor="middle" font-family="'Space Mono', monospace" font-size="7" fill="#ffaa00" fill-opacity="0.7">Score 85%</text>
  <circle cx="1093" cy="170" r="30" fill="url(#nodeGlowAmber)" opacity="0.6"/>
  <circle cx="1093" cy="170" r="5" fill="#ffaa00" class="pulse-amber"/>

  <!-- Small floating vector dots (right side ambience) -->
  <circle cx="840" cy="80" r="2.5" fill="#00d4ff" fill-opacity="0.4"/>
  <circle cx="860" cy="260" r="2" fill="#00ff88" fill-opacity="0.35"/>
  <circle cx="1000" cy="90" r="2" fill="#00d4ff" fill-opacity="0.3"/>
  <circle cx="1020" cy="270" r="2.5" fill="#ffaa00" fill-opacity="0.3"/>
  <circle cx="150" cy="60" r="2" fill="#00d4ff" fill-opacity="0.3"/>
  <circle cx="170" cy="290" r="2.5" fill="#00ff88" fill-opacity="0.3"/>
  <circle cx="220" cy="80" r="1.5" fill="#00d4ff" fill-opacity="0.25"/>
  <circle cx="200" cy="280" r="2" fill="#00d4ff" fill-opacity="0.2"/>

  <!-- ════════════════════════════════ -->
  <!-- CENTER: Main title block        -->
  <!-- ════════════════════════════════ -->

  <!-- Horizontal rule top -->
  <line x1="440" y1="92" x2="760" y2="92" stroke="#00d4ff" stroke-width="0.5" stroke-opacity="0.4"/>
  <!-- Horizontal rule bottom -->
  <line x1="440" y1="250" x2="760" y2="250" stroke="#00d4ff" stroke-width="0.5" stroke-opacity="0.4"/>

  <!-- Corner brackets -->
  <!-- Top-left -->
  <polyline points="440,92 440,80 455,80" fill="none" stroke="#00d4ff" stroke-width="1" stroke-opacity="0.6"/>
  <!-- Top-right -->
  <polyline points="760,92 760,80 745,80" fill="none" stroke="#00d4ff" stroke-width="1" stroke-opacity="0.6"/>
  <!-- Bottom-left -->
  <polyline points="440,250 440,262 455,262" fill="none" stroke="#00d4ff" stroke-width="1" stroke-opacity="0.6"/>
  <!-- Bottom-right -->
  <polyline points="760,250 760,262 745,262" fill="none" stroke="#00d4ff" stroke-width="1" stroke-opacity="0.6"/>

  <!-- Label tag top -->
  <rect x="563" y="74" width="74" height="16" rx="3" fill="#00d4ff" fill-opacity="0.12" stroke="#00d4ff" stroke-width="0.5" stroke-opacity="0.5"/>
  <text x="600" y="86" text-anchor="middle" font-family="'Space Mono', monospace" font-size="8" fill="#00d4ff" letter-spacing="2">v1.0.0</text>

  <!-- Main title -->
  <text x="600" y="152" text-anchor="middle"
        font-family="'Syne', 'Space Mono', monospace"
        font-size="58"
        font-weight="800"
        fill="#ffffff"
        letter-spacing="-1"
        filter="url(#softGlow)"
        class="fade-in-1">SkillSync</text>

  <!-- AI label with accent color -->
  <text x="600" y="188" text-anchor="middle"
        font-family="'Syne', 'Space Mono', monospace"
        font-size="20"
        font-weight="700"
        fill="#00d4ff"
        letter-spacing="8"
        class="fade-in-2">AI</text>

  <!-- Tagline -->
  <text x="600" y="222" text-anchor="middle"
        font-family="'Space Mono', monospace"
        font-size="10.5"
        fill="#8ba8c8"
        letter-spacing="1"
        class="fade-in-3">Hybrid Vector Search · Local LLMs · Skill Gap Analysis</text>

  <!-- Bottom pill badges -->
  <g class="fade-in-4">
    <!-- Privacy First -->
    <rect x="466" y="270" width="82" height="20" rx="10" fill="#00d4ff" fill-opacity="0.1" stroke="#00d4ff" stroke-width="0.6" stroke-opacity="0.5"/>
    <text x="507" y="284" text-anchor="middle" font-family="'Space Mono', monospace" font-size="8" fill="#00d4ff">🔒 Private</text>

    <!-- FastAPI -->
    <rect x="558" y="270" width="82" height="20" rx="10" fill="#00ff88" fill-opacity="0.08" stroke="#00ff88" stroke-width="0.6" stroke-opacity="0.5"/>
    <text x="599" y="284" text-anchor="middle" font-family="'Space Mono', monospace" font-size="8" fill="#00ff88">⚡ FastAPI</text>

    <!-- LangChain -->
    <rect x="650" y="270" width="84" height="20" rx="10" fill="#ffaa00" fill-opacity="0.08" stroke="#ffaa00" stroke-width="0.6" stroke-opacity="0.5"/>
    <text x="692" y="284" text-anchor="middle" font-family="'Space Mono', monospace" font-size="8" fill="#ffaa00">🦜 LangChain</text>
  </g>

  <!-- Center engine node (the hub) -->
  <circle cx="600" cy="170" r="48" fill="none" stroke="#00d4ff" stroke-width="0.4" stroke-opacity="0.15" stroke-dasharray="3 5"/>
  <circle cx="600" cy="170" r="72" fill="none" stroke="#00d4ff" stroke-width="0.3" stroke-opacity="0.08" stroke-dasharray="2 8"/>

  <!-- Subtle bottom glow bar -->
  <rect x="0" y="320" width="1200" height="20" fill="url(#bg)" opacity="0.8"/>
  <line x1="200" y1="336" x2="1000" y2="336" stroke="#00d4ff" stroke-width="0.5" stroke-opacity="0.15"/>
</svg>
